<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Settings</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>SETTINGS</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>個人設定</h2>
<p class="system-status">全メンバー共通</p>

<label>表示名</label>
<input type="text" id="username">
<button id="updateUsernameButton">UPDATE USERNAME</button>

<hr>

<label>現在のパスワード</label>
<input type="password" id="currentPassword">

<label>新しいパスワード</label>
<input type="password" id="newPassword">

<label>新しいパスワード（確認）</label>
<input type="password" id="confirmPassword">

<button id="changePasswordButton">CHANGE PASSWORD</button>

</section>

<section class="register-box">
<h2>デザイン設定</h2>
<p class="system-status">全メンバー共通・アカウントとこの端末に保存されます</p>

<label>カラーテーマ（背景色）</label>
<select id="themeSelect">
<option value="cyan">CYAN（デフォルト・ダーク）</option>
<option value="blue">BLUE（ダーク）</option>
<option value="green">GREEN（ダーク・マトリックス風）</option>
<option value="red">RED（ダーク）</option>
<option value="purple">PURPLE（ダーク）</option>
<option value="light">LIGHT（ライト背景）</option>
</select>

<label>デザインスタイル（フォント・UI）</label>
<select id="styleSelect">
<option value="terminal">TERMINAL（等幅フォント・ネオン風・角無し）</option>
<option value="modern">MODERN（サンセリフ・フラット・角丸）</option>
<option value="classic">CLASSIC（セリフフォント・落ち着いたデザイン）</option>
</select>

<button id="saveDesignButton">SAVE DESIGN</button>

<p style="font-size:12px;opacity:0.7;margin-top:10px;">
※ プルダウンを変更するとすぐにプレビューされます。SAVE DESIGNを押すとアカウントに保存され、他の端末でログインした際にも自動で反映されます。
</p>

</section>

<section class="register-box" id="systemSection" style="display:none;">
<h2>システム設定</h2>
<p class="system-status">ACCESS LEVEL 5 (FOUNDER) ONLY</p>

<label>新規登録時のデフォルト権限レベル</label>
<select id="defaultLevelSelect">
<option value="5">5 - ADMIN</option>
<option value="4">4 - MANAGER</option>
<option value="3">3 - STAFF</option>
<option value="2">2 - MEMBER</option>
<option value="1">1 - GUEST</option>
</select>

<label>ログイン失敗の自動ロック閾値（0で無効）</label>
<input type="number" id="lockoutThresholdInput" min="0" step="1">

<label>
<input type="checkbox" id="maintenanceModeCheckbox" style="width:auto;">
メンテナンスモード（ON中はACCESS LEVEL 5以外ログイン不可）
</label>

<label>ダッシュボードのお知らせバナー（空欄で非表示）</label>
<textarea id="announcementInput" rows="3"></textarea>

<label>ログイン履歴の保持日数（手動削除用の基準日数）</label>
<input type="number" id="retentionDaysInput" min="0" step="1">

<button id="saveSystemSettingsButton" style="margin-bottom:15px;">SAVE SYSTEM SETTINGS</button>
<button id="purgeLogsButton">古いログイン履歴を今すぐ削除</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/settings.js"></script>

</body>

</html>
