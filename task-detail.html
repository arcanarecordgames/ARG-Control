<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Task Detail</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>TASK DETAIL</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">

<p>TITLE : <span id="title">-</span></p>
<p>ASSIGNEE : <span id="assignee">-</span></p>
<p>AUTHOR : <span id="author">-</span></p>
<p>DUE DATE : <span id="dueDate">-</span></p>
<p>STATUS : <span id="status">-</span></p>

<hr>

<p id="body" style="white-space:pre-wrap;">LOADING...</p>

<div id="controlArea" style="display:none;margin-top:20px;">
<button id="toggleButton" style="margin-bottom:10px;">-</button>
<button id="editButton" style="margin-bottom:10px;">EDIT</button>
<button id="deleteButton">DELETE</button>
</div>

<br>

<button onclick="location.href='tasks.html'">BACK TO TASK LIST</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/task-detail.js"></script>

</body>

</html>
