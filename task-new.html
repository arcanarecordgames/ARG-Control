<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | New Task</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>NEW TASK</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>タスクを作成</h2>

<label>TITLE</label>
<input type="text" id="title" placeholder="タスク名">

<label>BODY</label>
<textarea id="body" rows="8" placeholder="内容"></textarea>

<label>DUE DATE（任意）</label>
<button type="button" id="dueDateButton" style="text-align:left;">📅 日付を選択（未設定）</button>
<div class="calendar-grid" id="dueDateCalendar" style="display:none;"></div>

<label>ASSIGNEE</label>
<select id="assigneeSelect">
<option value="">未割当</option>
</select>

<label>MENTION（任意・複数選択可）</label>
<select id="mentionSelect" multiple style="height:120px;"></select>
<p style="font-size:12px;opacity:0.7;margin-top:-10px;">選択したメンバーに、このタスクの通知(ニュース)が届きます。</p>

<button id="submitButton">CREATE TASK</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/task-new.js"></script>

</body>

</html>
