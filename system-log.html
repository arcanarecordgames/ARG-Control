<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | System Log</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>SYSTEM LOG</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<button onclick="location.href='admin.html'" style="width:auto;padding:8px 16px;margin-bottom:20px;">← BACK TO 管理画面</button>

<section class="member-table">
<h2>操作ログ（誰が・いつ・何をしたか）</h2>
<p style="font-size:12px;opacity:0.7;">ログイン履歴は別画面（ログイン履歴）で確認できます。こちらは企画/スレッド/ファイル/メール/プロフィール/ニュース投稿などの操作記録です。</p>

<table>
<tr>
<th>TIME</th>
<th>MEMBER</th>
<th>ACTION</th>
<th>DETAIL</th>
<th>PAGE</th>
</tr>
<tbody id="logList">
<tr><td colspan="5">LOADING...</td></tr>
</tbody>
</table>
</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>ADMINISTRATOR ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/system-log.js"></script>

</body>

</html>
