<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Account Control</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>ACCOUNT CONTROL SYSTEM</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>ACCOUNT CONTROL</h2>

<p>MEMBER ID : <span id="memberID">-</span></p>
<p>CURRENT STATUS : <span id="currentStatus">-</span></p>

<label>CHANGE STATUS</label>
<select id="statusSelect">
<option value="active">ACTIVE</option>
<option value="locked">LOCKED</option>
<option value="suspended">SUSPENDED</option>
</select>

<button id="updateButton">UPDATE STATUS</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>ADMINISTRATOR ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/account-control.js"></script>

</body>

</html>
