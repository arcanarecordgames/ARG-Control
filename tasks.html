<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Tasks</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>TASK SYSTEM</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<button onclick="location.href='dashboard.html'" style="width:auto;padding:8px 16px;margin-bottom:20px;">← BACK TO DASHBOARD</button>

<section class="member-table">
<h2>CALENDAR</h2>

<div class="calendar-top-row">
<h3 id="calendarHeader">-</h3>
<button id="newButton" style="width:auto;">＋ NEW TASK</button>
</div>
<div class="calendar-nav-row">
<button id="prevMonth" style="width:auto;">&lt; PREV</button>
<button id="nextMonth" style="width:auto;">NEXT &gt;</button>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

</section>

<section class="member-table">
<h2>TASK LIST</h2>

<p>
<span id="filterLabel">すべてのタスク</span>
<button id="clearFilterButton" style="display:none;width:auto;padding:6px 14px;margin-left:10px;">絞り込み解除</button>
</p>

<table>
<tr>
<th style="width:8%;">DONE</th>
<th>TITLE</th>
<th>ASSIGNEE</th>
<th>DUE DATE</th>
</tr>
<tbody id="taskList">
<tr><td colspan="4">LOADING...</td></tr>
</tbody>
</table>
</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/tasks.js"></script>

</body>

</html>
