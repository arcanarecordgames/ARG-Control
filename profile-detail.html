<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>PROFILE</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">

<p>USERNAME : <span id="username">-</span></p>
<p>MID : <span id="mid">-</span></p>
<p>ACCESS LEVEL : <span id="accessLevel">-</span></p>
<p>生年月日 : <span id="birthDate">-</span></p>
<p>登録日 : <span id="registeredAt">-</span></p>
<p>性別 : <span id="gender">-</span></p>
<p>担当 : <span id="roles">-</span></p>

<hr>

<p>自己紹介：</p>
<p id="bio" style="white-space:pre-wrap;">-</p>

<div id="editArea" style="display:none;margin-top:15px;">
<button id="editButton" style="width:auto;padding:8px 16px;">EDIT PROFILE</button>
</div>

<br>

<button onclick="location.href='profiles.html'">BACK TO PROFILE LIST</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/profile-detail.js"></script>

</body>

</html>
