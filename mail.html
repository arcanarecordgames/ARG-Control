<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Mail</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>MAIL SYSTEM</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="member-table">
<h2>MAIL BOX</h2>

<button onclick="location.href='dashboard.html'" style="width:auto;padding:8px 16px;margin-bottom:15px;">← BACK TO DASHBOARD</button>
<br>
<button id="composeButton" style="display:none;margin-bottom:20px;">NEW MAIL</button>

<table>
<tr>
<th>FROM</th>
<th>SUBJECT</th>
<th>DATE</th>
<th>STATUS</th>
</tr>
<tbody id="mailList">
<tr><td colspan="4">LOADING...</td></tr>
</tbody>
</table>
</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/mail.js"></script>

</body>

</html>
