<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | New Thread</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>NEW THREAD</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>スレッドを作成</h2>
<p style="font-size:12px;opacity:0.7;">投稿後の編集はできません。内容をご確認の上、投稿してください。</p>

<label>TITLE</label>
<input type="text" id="title" placeholder="スレッドタイトル">

<label>BODY</label>
<textarea id="body" rows="10" placeholder="内容"></textarea>

<button id="submitButton">POST THREAD</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/record-new.js"></script>

</body>

</html>
