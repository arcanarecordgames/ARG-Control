<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ARG Control | Compose Mail
</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="admin-container">

<header class="admin-header">

<h1>
ARG Control
</h1>

<p>
MAIL COMPOSE SYSTEM
</p>

<div class="system-status">

STATUS :
<span>ONLINE</span>

</div>

</header>



<section class="register-box">

<h2>
NEW MAIL
</h2>


<label>

<input
type="checkbox"
id="sendAll">

全メンバーへ送信

</label>


<label>
宛先
</label>

<select
id="receiverSelect"
multiple>

</select>


<label>
件名
</label>

<input
type="text"
id="subject">


<label>
本文
</label>

<textarea
id="body"
rows="12"></textarea>


<button id="sendButton">

SEND MAIL

</button>

</section>


<footer>

<p>
ARG CONTROL SYSTEM
</p>

<p>
MAIL SYSTEM
</p>

</footer>

</div>

<script
type="module"
src="js/mail-compose.js">

</script>

</body>

</html>
