<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Online Time</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>ONLINE TIME ANALYTICS</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<button onclick="location.href='admin.html'" style="width:auto;padding:8px 16px;margin-bottom:20px;">← BACK TO 管理画面</button>

<section class="member-table">
<h2>メンバー別オンライン時間</h2>
<p style="font-size:12px;opacity:0.7;">ログイン中の各画面から一定間隔で送られる在席確認をもとに、日ごとのオンライン時間を集計したグラフです（目安の値です）。</p>

<label>対象メンバー</label>
<select id="memberSelect">
<option value="">選択してください</option>
</select>

<label>表示期間</label>
<select id="rangeSelect">
<option value="7">直近7日間</option>
<option value="14" selected>直近14日間</option>
<option value="30">直近30日間</option>
</select>

<div class="chart-area" id="chartArea" style="margin-top:20px;">
<p style="opacity:0.6;">LOADING...</p>
</div>

<table style="margin-top:25px;">
<tr>
<th>日付</th>
<th>オンライン時間</th>
</tr>
<tbody id="dataTable">
</tbody>
</table>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>ADMINISTRATOR ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/online-time.js"></script>

</body>

</html>
