<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Thread</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>THREAD</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">

<h2 id="opTitle" style="border:none;padding:0;margin-bottom:10px;">-</h2>

<div class="post-meta">
<span id="opAuthor">-</span> ・ <span id="opDate">-</span>
</div>

<div class="post-body" id="opBody">LOADING...</div>

<div id="opReactions"></div>

<div id="opDeleteArea" style="display:none;margin-top:15px;">
<button id="opDeleteButton" style="width:auto;padding:8px 16px;">DELETE THREAD</button>
</div>

</section>

<section class="register-box">
<h2>書き込み</h2>

<div id="postList">LOADING...</div>

<hr>

<label>新しい書き込み（投稿後の編集はできません）</label>
<textarea id="newPostInput" rows="5"></textarea>
<button id="newPostButton">POST</button>

</section>

<button onclick="location.href='records.html'">BACK TO THREAD LIST</button>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/record-detail.js"></script>

</body>

</html>
