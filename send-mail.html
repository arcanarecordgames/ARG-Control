<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
ARG Control | Send Mail
</title>


<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="admin-container">


<header class="admin-header">

<h1>
ARG Control
</h1>


<p>
MAIL SEND SYSTEM
</p>


<div class="system-status">

STATUS :
<span>
ONLINE
</span>

</div>


</header>





<section class="register-box">


<h2>
NEW MAIL
</h2>




<label>
TO
</label>


<select id="receiver" multiple>


</select>





<label>
SUBJECT
</label>


<input 
type="text"
id="subject"
placeholder="SUBJECT">






<label>
MESSAGE
</label>


<textarea
id="message"
rows="10"
placeholder="MESSAGE"></textarea>





<button id="sendButton">

SEND MAIL

</button>




</section>






<footer>


<p>
ARG CONTROL SYSTEM
</p>


<p>
AUTHORIZED ACCESS ONLY
</p>


</footer>



</div>




<script type="module" src="js/send-mail.js"></script>


</body>

</html>
