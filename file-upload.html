<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Upload File</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>UPLOAD FILE</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>ファイルをアップロード</h2>
<p style="font-size:12px;opacity:0.7;">対応形式：画像(jpg/png/gif/webp)・動画(mp4/webm/mov)・音声(mp3/wav/m4a) ／ 上限 50MB</p>

<label>FILE</label>
<input type="file" id="fileInput" accept="image/*,video/*,audio/*">

<label>DESCRIPTION（任意）</label>
<textarea id="description" rows="4" placeholder="ファイルの説明"></textarea>

<div class="progress-track" id="progressArea" style="display:none;">
<div class="progress-fill" id="progressFill">0%</div>
</div>

<button id="uploadButton">UPLOAD</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/file-upload.js"></script>

</body>

</html>
