<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Serena Rules</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>🌸 セレナ応答管理</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<button onclick="location.href='admin.html'" style="width:auto;padding:8px 16px;margin-bottom:20px;">← BACK TO 管理画面</button>

<section class="register-box">
<h2 id="formTitle">新しいルールを追加</h2>
<p style="font-size:12px;opacity:0.7;">
セレナへの質問に含まれる「キーワード」と、それに対する「回答」のペアを登録します。ユーザーの発言にキーワードが1つでも含まれていれば、その回答が返されます。ここで追加したルールは、あらかじめ用意されている既定の回答よりも優先して照合されます。
</p>

<label>キーワード（カンマ区切りで複数指定可）</label>
<input type="text" id="keywordsInput" placeholder="例：稼働時間, オンライン時間">

<label>回答</label>
<textarea id="replyInput" rows="4" placeholder="例：稼働時間は管理画面の「オンライン時間」からメンバーごとに確認できますよ。"></textarea>

<button id="submitButton">追加する</button>
<button id="cancelEditButton" style="display:none;margin-top:10px;background:transparent;">編集をキャンセル</button>

</section>

<section class="member-table">
<h2>登録済みのルール一覧</h2>

<table>
<tr>
<th style="width:30%;">キーワード</th>
<th>回答</th>
<th style="width:15%;">操作</th>
</tr>
<tbody id="ruleList">
<tr><td colspan="3">LOADING...</td></tr>
</tbody>
</table>
</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>ADMINISTRATOR ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/serena-rules.js"></script>

</body>

</html>
