<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Edit Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="admin-container">

<header class="admin-header">
<h1>ARG Control</h1>
<p>EDIT PROFILE</p>
<div class="system-status">
STATUS : <span>ONLINE</span>
</div>
</header>

<section class="register-box">
<h2>プロフィールを編集</h2>

<label>生年月日（任意）</label>
<input type="date" id="birthDate">

<label>性別</label>
<select id="gender">
<option value="">回答しない</option>
<option value="男性">男性</option>
<option value="女性">女性</option>
<option value="その他">その他</option>
</select>

<label>担当（複数選択可）</label>
<div id="rolesArea" style="margin-bottom:20px;"></div>

<label>自己紹介</label>
<textarea id="bio" rows="6"></textarea>

<button id="saveButton">SAVE PROFILE</button>

</section>

<footer>
<p>ARG CONTROL SYSTEM</p>
<p>AUTHORIZED ACCESS ONLY</p>
</footer>

</div>

<script type="module" src="js/profile-edit.js"></script>

</body>

</html>
