<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Control | Member Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="register-container">

<header class="register-header">
<h1>ARG Control</h1>
<p>MEMBER REGISTRATION SYSTEM</p>
</header>

<button onclick="location.href='admin.html'" style="width:auto;padding:8px 16px;margin-bottom:20px;">← BACK TO 管理画面</button>

<section class="register-box">
<h2>CREATE MEMBER</h2>
<p class="system-status">ADMINISTRATOR ONLY</p>

<label>Username</label>
<input type="text" id="username" placeholder="Member Name">

<label>Password</label>
<input type="password" id="password" placeholder="Password">

<label>Access Level</label>
<select id="accessLevel">
<option value="5">5 - ADMIN</option>
<option value="4">4 - MANAGER</option>
<option value="3">3 - STAFF</option>
<option value="2" selected>2 - MEMBER</option>
<option value="1">1 - GUEST</option>
</select>

<button id="createButton">CREATE MEMBER</button>

</section>

<footer>
ARG CONTROL SYSTEM
<br>
AUTHORIZED ACCESS ONLY
</footer>

</div>

<!-- 作成完了の確認モーダル。確定を押すまで裏の画面は操作できず、連打による誤操作を防止する -->
<div class="modal-overlay" id="resultModal">
<div class="modal-box">
<h3>アカウント作成されました</h3>
<p>
ユーザー名 : <span id="resultUsername">-</span><br>
MID : <span id="resultMID">-</span><br>
登録日 : <span id="resultDate">-</span>
</p>
<button id="confirmButton">確定</button>
</div>
</div>

<script type="module" src="js/register.js"></script>

</body>

</html>
